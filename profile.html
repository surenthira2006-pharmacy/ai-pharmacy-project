<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | Smart Pharmacy</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <h2><i class="fa-solid fa-capsules"></i> Smart Pharmacy</h2>

    <ul>

        <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

        <li><a href="inventory.html"><i class="fa-solid fa-pills"></i> Medicine Inventory</a></li>

        <li><a href="stock.html"><i class="fa-solid fa-box"></i> Stock Management</a></li>

        <li><a href="expiry.html"><i class="fa-solid fa-calendar-xmark"></i> Expiry Management</a></li>

        <li><a href="chatbot.html"><i class="fa-solid fa-robot"></i> AI Chatbot</a></li>

        <li><a href="reports.html"><i class="fa-solid fa-chart-column"></i> Reports</a></li>

        <li><a href="profile.html" class="active"><i class="fa-solid fa-user"></i> Profile</a></li>

        <li><a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

    </ul>

</div>

<!-- Main Content -->

<div class="main">

    <!-- Header -->

    <div class="header">

        <h1>Admin Profile</h1>

        <div class="user">
            <i class="fa-solid fa-user-circle"></i>
            Admin
        </div>

    </div>

    <!-- Profile Card -->

    <div class="section">

        <div style="text-align:center;">

            <img src="images/avatar.png"
                 alt="Profile"
                 width="120"
                 height="120"
                 style="border-radius:50%;">

            <h2>Administrator</h2>

            <p>Smart Pharmacy System</p>

        </div>

    </div>

    <!-- Profile Details -->

    <div class="section">

        <h2>Profile Information</h2>

        <form>

            <label>Full Name</label>

            <input type="text" value="Administrator">

            <label>Email</label>

            <input type="email" value="admin@pharmacy.com">

            <label>Phone Number</label>

            <input type="text" value="+91 9876543210">

            <label>Pharmacy Name</label>

            <input type="text" value="Smart Pharmacy">

            <label>Address</label>

            <textarea rows="4">Tamil Nadu, India</textarea>

            <button type="submit">
                <i class="fa-solid fa-floppy-disk"></i>
                Save Changes
            </button>

        </form>

    </div>

    <!-- Change Password -->

    <div class="section">

        <h2>Change Password</h2>

        <form>

            <input type="password" placeholder="Current Password">

            <input type="password" placeholder="New Password">

            <input type="password" placeholder="Confirm Password">

            <button type="submit">
                <i class="fa-solid fa-key"></i>
                Update Password
            </button>

        </form>

    </div>

    <!-- Account Settings -->

    <div class="section">

        <h2>Account Settings</h2>

        <button>
            <i class="fa-solid fa-bell"></i>
            Notification Settings
        </button>

        <button>
            <i class="fa-solid fa-download"></i>
            Download My Data
        </button>

        <button onclick="window.location.href='login.html'">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>

    </div>

</div>

<!-- JavaScript -->

<script src="js/auth.js"></script>
<script src="js/profile.js"></script>

</body>

</html>
